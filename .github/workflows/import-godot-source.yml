name: Import Godot source ZIP

on:
  push:
    paths:
      - 'NEON_RUNNER_2099_v4.3.0-G_source.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="NEON_RUNNER_2099_v4.3.0-G_source.zip"
          test -f "$ARCHIVE" || { echo "::error::Upload $ARCHIVE to the repository root first."; exit 1; }
          echo "854b616b90f98baf50217804b9c10e164d3d81b6f54cc58e8409b9c28670ec72  $ARCHIVE" | sha256sum -c -
          unzip -tq "$ARCHIVE"

      - name: Validate project layout and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-source"
          unzip -q "NEON_RUNNER_2099_v4.3.0-G_source.zip" -d "$RUNNER_TEMP/godot-source"
          PROJECT_DIR="$RUNNER_TEMP/godot-source/neon-runner-godot"
          test -f "$PROJECT_DIR/project.godot" || { echo "::error::project.godot not found in expected project folder."; exit 1; }
          test -f "$PROJECT_DIR/RELEASE_MANIFEST.json" || { echo "::error::RELEASE_MANIFEST.json is missing."; exit 1; }
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("$RUNNER_TEMP/godot-source/neon-runner-godot/RELEASE_MANIFEST.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("version") == "4.3.0-G", f"Unexpected version: {data.get('version')!r}"
          assert data.get("main_scene") == "res://scenes/main.tscn", "Unexpected main scene"
          print("Manifest validated: version", data["version"], "| engine", data.get("godot_recommended_version"))
          PY

      - name: Install complete Godot project at repository root
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$RUNNER_TEMP/godot-source/neon-runner-godot"
          rsync -a --exclude='.git/' "$PROJECT_DIR/" ./
          rm -f "NEON_RUNNER_2099_v4.3.0-G_source.zip"
          test -f project.godot
          test -f RELEASE_MANIFEST.json
          test -f scenes/main.tscn

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Godot source v4.3.0-G"
          git push
